// FORK: Health Connect reading for the openGym fork (specs/fork-health). Java, like upstream's
// HealthConnectPlugin, on the same connect-client version.
apply plugin: 'com.android.library'

android {
    namespace 'com.cezar.opengym.forkhealth'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
}
