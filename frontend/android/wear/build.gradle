// FORK (specs/fork-watch R2): the Wear OS watch app (Galaxy Watch 4 Classic and up, Wear OS 3+).
// Same applicationId, signing key and version as the phone app: the Data Layer only connects the
// two when they match (RS-1.6).
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.cezar.opengym.wear'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.cezar.opengym'
        minSdkVersion 30          // Wear OS 3 (D-1)
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    buildTypes {
        debug {
            applicationIdSuffix '.test'   // as the phone's debug build: the two find each other
        }
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Version and release signing shared with the phone app (fork/android).
def forkAndroidDir = rootProject.file('../../fork/android')
apply from: new File(forkAndroidDir, 'fork-version.gradle')
apply from: new File(forkAndroidDir, 'fork-signing.gradle')

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':watch-core')
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation platform("androidx.compose:compose-bom:2025.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.wear.compose:compose-material:1.4.1"
    implementation "androidx.wear.compose:compose-foundation:1.4.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.1"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
}
