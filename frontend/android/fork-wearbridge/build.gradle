// FORK (specs/fork-watch R2): the phone's end of the Wear OS watch link. A Capacitor plugin named
// WatchBridge with the same calls as upstream's iOS WatchBridgePlugin.swift, so upstream's
// lib/watch-sync.js runs unchanged, over the Wearable Data Layer instead of WatchConnectivity.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.cezar.opengym.wearbridge'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    testImplementation "junit:junit:4.13.2"
}
